<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Producto — Kori Cosmetics</title>
<meta name="description" id="meta-description" content="Compra maquillaje en Kori Cosmetics, con envíos a Corozal, Sincelejo y toda Colombia.">
<meta name="keywords" content="maquillaje Corozal, maquillaje Sucre, maquillaje Sincelejo, maquillaje tiktok Colombia, maquillaje viral, tienda de maquillaje, maquillaje online">
<meta name="geo.region" content="CO-SUC">
<meta name="geo.placename" content="Corozal, Sincelejo, Sucre">
<link rel="canonical" id="canonical-link" href="https://www.koricosmetics.fun/">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="assets/style.css">

<meta property="og:type" content="product">
<meta property="og:site_name" content="Kori Cosmetics">
<meta property="og:title" id="og-title" content="Kori Cosmetics">
<meta property="og:description" id="og-description" content="Compra maquillaje en Kori Cosmetics.">
<meta property="og:image" id="og-image" content="https://www.koricosmetics.fun/logo.png">
<meta property="og:url" id="og-url" content="https://www.koricosmetics.fun/">
<meta property="og:locale" content="es_CO">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><img src="logo.png" alt="Kori Cosmetics"> Kori Cosmetics</a>
    <div class="nav-links"><a href="index.html">Inicio</a><a href="index.html#catalogo">Catálogo</a></div>
    <div class="nav-actions">
      <div id="nav-auth-slot"></div>
      <a href="carrito.html" class="icon-btn" aria-label="Carrito">🛍️<span class="cart-count" style="display:none">0</span></a>
      <button class="theme-toggle" aria-label="Cambiar tema"><span class="knob">☀️</span></button>
    </div>
  </div>
</nav>

<div id="content" class="container">
  <div class="loader">Cargando producto...</div>
</div>

<footer><div class="container"><p>© <span id="year"></span> Kori Cosmetics.</p></div></footer>

<nav class="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="index.html" class="mobile-nav-item"><span class="icon">🏠</span><span>Inicio</span></a>
    <a href="index.html#catalogo" class="mobile-nav-item active"><span class="icon">🗂️</span><span>Catálogo</span></a>
    <a href="index.html?search=1#catalogo" class="mobile-nav-item"><span class="icon">🔍</span><span>Buscar</span></a>
    <a href="carrito.html" class="mobile-nav-item"><span class="icon">🛍️</span><span class="cart-count" style="display:none">0</span><span>Carrito</span></a>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

function resolveSlug() {
  const fromQuery = new URLSearchParams(location.search).get('slug');
  if (fromQuery) return decodeURIComponent(fromQuery);
  const path = location.pathname.replace(/^\/+|\/+$/g, '');
  if (!path || path.toLowerCase() === 'producto.html') return null;
  return decodeURIComponent(path.split('/').pop());
}

async function loadProduct() {
  const slug = resolveSlug();
  const content = qs('#content');
  if (!slug) {
    content.innerHTML = `<div class="empty-state">Producto no especificado. <a href="index.html">Volver al catálogo</a></div>`;
    return;
  }

  const { data: product } = await supabase
    .from('products')
    .select('*, categories(name, slug)')
    .ilike('slug', slug)
    .eq('active', true)
    .maybeSingle();

  if (!product) {
    content.innerHTML = `<div class="empty-state">No encontramos este producto 💔 <br><a href="index.html" style="color:var(--primary-dark);font-weight:600">Volver al catálogo</a></div>`;
    return;
  }

  document.title = `${product.name} — Kori Cosmetics`;
  logProductView(product.id);
  const profile = await getCurrentProfile();
  const isAdmin = !!(profile && profile.role === 'admin');

  const { data: variants } = await supabase.from('product_variants').select('*').eq('product_id', product.id);
  const groups = {};
  (variants || []).forEach(v => { (groups[v.name] = groups[v.name] || []).push(v); });

  let comboItems = [];
  if (product.is_combo) {
    const { data: items } = await supabase.from('combo_items').select('*, products(name, image_url)').eq('combo_id', product.id);
    comboItems = items || [];
  }

  const images = (product.images && product.images.length) ? product.images : (product.image_url ? [product.image_url] : []);

  // SEO: título, descripción y tarjeta de enlace propios de este producto,
  // más datos estructurados (precio y disponibilidad) para que Google pueda
  // mostrarlos directo en el resultado de búsqueda.
  const pageUrl = `https://www.koricosmetics.fun/${product.slug}`;
  const baseDesc = product.description || `Compra ${product.name} en Kori Cosmetics.`;
  const localSuffix = ' Envíos a Corozal, Sincelejo y Sucre.';
  const shortDesc = (baseDesc.length + localSuffix.length <= 160 ? baseDesc + localSuffix : baseDesc).slice(0, 160);
  qs('#meta-description').setAttribute('content', shortDesc);
  qs('#canonical-link').setAttribute('href', pageUrl);
  qs('#og-title').setAttribute('content', `${product.name} — Kori Cosmetics`);
  qs('#og-description').setAttribute('content', shortDesc);
  qs('#og-image').setAttribute('content', images[0] || 'https://www.koricosmetics.fun/logo.png');
  qs('#og-url').setAttribute('content', pageUrl);

  const ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'Product',
    name: product.name,
    description: product.description || '',
    image: images,
    sku: product.id,
    offers: {
      '@type': 'Offer',
      priceCurrency: 'COP',
      price: product.price,
      availability: product.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
      url: pageUrl,
    },
  });
  document.head.appendChild(ld);

  content.innerHTML = `
    <div class="breadcrumb"><a href="index.html">Inicio</a> / <a href="index.html#catalogo">Catálogo</a> / ${product.categories ? product.categories.name + ' / ' : ''}${product.name}</div>
    <div class="product-detail ${product.is_combo ? 'is-combo' : ''}">
      <div>
        <div class="tilt-stage" id="gallery-tilt-stage">
          <div class="detail-gallery" id="detail-gallery">${images.length ? `<img id="gallery-main-img" src="${images[0]}" alt="${product.name}">` : `<span style="font-size:4rem">${product.is_combo ? '🎁' : '💄'}</span>`}</div>
        </div>
        ${images.length > 1 ? `<div class="gallery-thumbs">${images.map((url, i) => `<img src="${url}" class="${i === 0 ? 'active' : ''}" data-thumb="${i}">`).join('')}</div>` : ''}
      </div>
      <div class="detail-info">
        ${product.is_combo ? '<span class="badge-combo" style="position:static;display:inline-block;margin-bottom:8px">🎁 Combo</span>' : ''}
        <span class="product-cat">${product.categories ? product.categories.name : 'Kori Cosmetics'}</span>
        <h1>${product.name}</h1>
        <div class="rating-summary" id="rating-summary"></div>
        <p style="color:var(--text-soft)">${product.description || ''}</p>
        <div class="detail-price" id="detail-price">${formatPrice(product.price)}</div>
        <div id="variant-groups"></div>
        ${comboItems.length ? `
          <div class="combo-includes">
            <label>Este combo incluye</label>
            <div class="combo-includes-list">
              ${comboItems.map(ci => `
                <div class="combo-include-item">
                  ${(ci.image_url || (ci.products && ci.products.image_url)) ? `<img src="${ci.image_url || ci.products.image_url}" alt="">` : ''}
                  <span>${ci.quantity} × ${esc(ci.products ? ci.products.name : 'Producto')}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
        <div class="flex gap-8" style="align-items:center;margin:20px 0">
          <div class="qty-control">
            <button id="qty-down">−</button><span id="qty-val">1</span><button id="qty-up">+</button>
          </div>
          <span style="color:var(--text-soft);font-size:.88rem">${product.stock > 0 ? product.stock + ' disponibles' : 'Sin stock'}</span>
        </div>
        <button class="btn btn-primary btn-block" id="add-to-cart" ${product.stock <= 0 ? 'disabled' : ''}>Agregar al carrito 🛍️</button>
      </div>
    </div>

    <section class="reviews-section" id="reviews-section">
      <h2 class="section-title" style="text-align:left">Reseñas</h2>
      <div id="reviews-list"><p class="empty-state">Cargando reseñas...</p></div>
      <div class="review-form">
        <h3 style="margin-top:0">Escribe tu reseña</h3>
        <form id="review-form">
          <div class="field"><label>Tu nombre</label><input type="text" id="review-name" required maxlength="80"></div>
          <div class="field">
            <label>Calificación</label>
            <div class="star-picker" id="star-picker">
              <span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
            </div>
          </div>
          <div class="field"><label>Comentario (opcional)</label><textarea id="review-comment" rows="3" maxlength="1000"></textarea></div>
          <button type="submit" class="btn btn-primary">Publicar reseña</button>
          <p class="form-msg" id="review-msg"></p>
        </form>
      </div>
    </section>

    <section class="recommend-section" id="related-section" style="display:none">
      <h2>Más productos de esta categoría</h2>
      <div class="product-grid" id="related-products"></div>
    </section>

    <section class="recommend-section" id="recommended-section" style="display:none">
      <h2>Recomendado para ti</h2>
      <div class="product-grid" id="recommended-products"></div>
    </section>
  `;

  qsa('[data-thumb]').forEach(t => t.addEventListener('click', () => {
    qs('#gallery-main-img').src = images[Number(t.dataset.thumb)];
    qsa('[data-thumb]').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
  }));

  // Efecto 3D: la foto principal se inclina siguiendo el mouse.
  const galleryStage = qs('#gallery-tilt-stage');
  const galleryCard = qs('#detail-gallery');
  galleryStage.addEventListener('mousemove', e => {
    const rect = galleryStage.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    galleryCard.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg) scale(1.02)`;
  });
  galleryStage.addEventListener('mouseleave', () => { galleryCard.style.transform = 'rotateY(0) rotateX(0) scale(1)'; });

  let selectedVariant = null;
  let currentPrice = product.price;
  const variantWrap = qs('#variant-groups');

  // Si cada "grupo" quedó guardado con una sola opción (ej. cada tono se
  // guardó con su propio nombre en vez de compartir uno), se muestran todas
  // juntas en una sola fila en vez de una debajo de la otra.
  const groupEntries = Object.entries(groups);
  const shouldFlatten = groupEntries.length > 1 && groupEntries.every(([, arr]) => arr.length === 1);
  const displayGroups = shouldFlatten ? [['Elige una opción', variants]] : groupEntries;

  displayGroups.forEach(([name, options]) => {
    const div = document.createElement('div');
    div.className = 'variant-group';
    div.innerHTML = `<label>${esc(name)}</label><div class="variant-options">${options.map(o => {
      const outOfStock = o.stock <= 0;
      const priceValue = o.price_override != null ? o.price_override : '';
      return `<span class="variant-chip ${outOfStock ? 'disabled' : ''}" data-value="${esc(o.value)}" data-price="${priceValue}" ${outOfStock ? 'title="Agotado"' : ''}>${esc(o.value)}${outOfStock ? ' (agotado)' : ''}</span>`;
    }).join('')}</div>`;
    variantWrap.appendChild(div);
  });

  qsa('.variant-chip:not(.disabled)', variantWrap).forEach(chip => chip.addEventListener('click', () => {
    qsa('.variant-chip', chip.closest('.variant-group')).forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    selectedVariant = chip.dataset.value;
    // Cada variante es independiente: si no tiene precio propio, el precio
    // del producto queda exactamente como estaba, sin sumas ni ajustes.
    currentPrice = chip.dataset.price !== '' ? Number(chip.dataset.price) : product.price;
    qs('#detail-price').textContent = formatPrice(currentPrice);
  }));

  let qty = 1;
  qs('#qty-up').addEventListener('click', () => { qty++; qs('#qty-val').textContent = qty; });
  qs('#qty-down').addEventListener('click', () => { if (qty > 1) qty--; qs('#qty-val').textContent = qty; });

  qs('#add-to-cart').addEventListener('click', () => {
    addToCart({
      id: product.id, name: product.name, price: currentPrice,
      image: product.image_url, variant: selectedVariant, qty,
    });
    const btn = qs('#add-to-cart');
    btn.textContent = 'Agregado ✓';
    setTimeout(() => btn.textContent = 'Agregar al carrito 🛍️', 1200);
  });

  // ---------- Reseñas ----------
  async function loadReviews() {
    const { data } = await supabase.from('reviews').select('*').eq('product_id', product.id).order('created_at', { ascending: false });
    const reviews = data || [];
    const list = qs('#reviews-list');
    if (!reviews.length) {
      list.innerHTML = `<p class="empty-state">Todavía no hay reseñas. ¡Sé la primera persona en opinar! 💜</p>`;
      qs('#rating-summary').innerHTML = '';
      return;
    }
    const avg = reviews.reduce((s, r) => s + r.rating, 0) / reviews.length;
    qs('#rating-summary').innerHTML = `<span class="stars">${renderStars(avg)}</span> ${avg.toFixed(1)} · ${reviews.length} reseña${reviews.length === 1 ? '' : 's'}`;
    list.innerHTML = reviews.map(r => `
      <div class="review-card">
        <div class="review-head">
          <div><span class="review-author">${esc(r.author_name)}</span> <span class="stars">${renderStars(r.rating)}</span></div>
          <span class="review-date">${new Date(r.created_at).toLocaleDateString('es-CO')}</span>
        </div>
        ${r.comment ? `<p>${esc(r.comment)}</p>` : ''}
        ${isAdmin ? `<button class="btn btn-ghost btn-sm" data-del-review="${r.id}" style="margin-top:8px">Eliminar</button>` : ''}
      </div>
    `).join('');
    if (isAdmin) {
      qsa('[data-del-review]', list).forEach(btn => btn.addEventListener('click', async () => {
        if (!confirm('¿Eliminar esta reseña?')) return;
        await supabase.from('reviews').delete().eq('id', btn.dataset.delReview);
        loadReviews();
      }));
    }
  }

  let selectedRating = 0;
  const starSpans = qsa('#star-picker span');
  starSpans.forEach(span => span.addEventListener('click', () => {
    selectedRating = Number(span.dataset.star);
    starSpans.forEach(s => s.classList.toggle('active', Number(s.dataset.star) <= selectedRating));
  }));

  qs('#review-form').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = qs('#review-msg');
    msg.className = 'form-msg';
    if (!selectedRating) { msg.className = 'form-msg error'; msg.textContent = 'Selecciona una calificación.'; return; }
    const name = qs('#review-name').value.trim();
    const comment = qs('#review-comment').value.trim();
    const { error } = await supabase.from('reviews').insert({ product_id: product.id, author_name: name, rating: selectedRating, comment: comment || null });
    if (error) { msg.className = 'form-msg error'; msg.textContent = 'No se pudo enviar: ' + error.message; return; }
    msg.className = 'form-msg success';
    msg.textContent = '¡Gracias por tu reseña!';
    qs('#review-form').reset();
    selectedRating = 0;
    starSpans.forEach(s => s.classList.remove('active'));
    loadReviews();
  });

  loadReviews();

  // ---------- Recomendaciones ----------
  function productCardHTML(p) {
    return `
      <div class="product-card ${p.is_combo ? 'is-combo' : ''}">
        <a href="/${p.slug}">
          <div class="product-thumb">
            ${p.is_combo ? '<span class="badge-combo">🎁 Combo</span>' : ''}
            ${p.image_url ? `<img src="${p.image_url}" alt="${esc(p.name)}">` : `<span class="placeholder">💄</span>`}
          </div>
        </a>
        <div class="product-body">
          <a href="/${p.slug}"><span class="product-name">${esc(p.name)}</span></a>
          <span class="product-price">${formatPrice(p.price)}</span>
        </div>
      </div>
    `;
  }

  async function loadRelated() {
    if (!product.category_id) return;
    const { data } = await supabase.from('products').select('*').eq('category_id', product.category_id).eq('active', true).neq('id', product.id).limit(8);
    const related = data || [];
    if (related.length) {
      qs('#related-products').innerHTML = related.map(productCardHTML).join('');
      qs('#related-section').style.display = '';
    }
  }

  async function loadRecommended() {
    const { data } = await supabase.from('top_viewed_products').select('*').neq('id', product.id).limit(8);
    let recommended = data || [];
    if (recommended.length < 4) {
      // Si todavía no hay suficientes vistas registradas, se completa con lo más reciente.
      const { data: fallback } = await supabase.from('products').select('*').eq('active', true).neq('id', product.id).order('created_at', { ascending: false }).limit(8);
      const seen = new Set(recommended.map(p => p.id));
      (fallback || []).forEach(p => { if (!seen.has(p.id) && recommended.length < 8) { recommended.push(p); seen.add(p.id); } });
    }
    if (recommended.length) {
      qs('#recommended-products').innerHTML = recommended.map(productCardHTML).join('');
      qs('#recommended-section').style.display = '';
    }
  }

  loadRelated();
  loadRecommended();
}

function esc(v) { return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadProduct();
</script>
</body>
</html>
